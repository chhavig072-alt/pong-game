<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .game-wrapper {
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      letter-spacing: 4px;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-bottom: 12px;
      font-size: 2rem;
      font-weight: bold;
    }

    canvas {
      display: block;
      width: min(900px, 95vw);
      height: auto;
      background: #000;
      border: 3px solid #fff;
      cursor: none;
    }

    p {
      color: #cbd5e1;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="game-wrapper">
    <h1>PONG</h1>

    <div class="scoreboard">
      <span id="playerScore">0</span>
      <span id="computerScore">0</span>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <p>Move your mouse over the game or use the ↑ and ↓ arrow keys.</p>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const playerScoreElement = document.getElementById("playerScore");
    const computerScoreElement = document.getElementById("computerScore");

    const paddle = {
      width: 14,
      height: 100,
      speed: 7
    };

    const player = {
      x: 25,
      y: canvas.height / 2 - paddle.height / 2,
      score: 0
    };

    const computer = {
      x: canvas.width - 25 - paddle.width,
      y: canvas.height / 2 - paddle.height / 2,
      score: 0,
      speed: 4.5
    };

    const ball = {
      size: 14,
      x: canvas.width / 2,
      y: canvas.height / 2,
      speed: 6,
      velocityX: 6,
      velocityY: 3
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2 - ball.size / 2;
      ball.y = canvas.height / 2 - ball.size / 2;

      const angle = (Math.random() * Math.PI / 3) - Math.PI / 6;
      ball.velocityX = Math.cos(angle) * ball.speed * direction;
      ball.velocityY = Math.sin(angle) * ball.speed;

      player.y = canvas.height / 2 - paddle.height / 2;
      computer.y = canvas.height / 2 - paddle.height / 2;
    }

    function movePlayer() {
      if (keys.ArrowUp) {
        player.y -= paddle.speed;
      }

      if (keys.ArrowDown) {
        player.y += paddle.speed;
      }

      player.y = clamp(player.y, 0, canvas.height - paddle.height);
    }

    function moveComputer() {
      const computerCenter = computer.y + paddle.height / 2;
      const ballCenter = ball.y + ball.size / 2;

      if (computerCenter < ballCenter - 8) {
        computer.y += computer.speed;
      } else if (computerCenter > ballCenter + 8) {
        computer.y -= computer.speed;
      }

      computer.y = clamp(computer.y, 0, canvas.height - paddle.height);
    }

    function ballHitsPaddle(paddleObject) {
      return (
        ball.x < paddleObject.x + paddle.width &&
        ball.x + ball.size > paddleObject.x &&
        ball.y < paddleObject.y + paddle.height &&
        ball.y + ball.size > paddleObject.y
      );
    }

    function update() {
      movePlayer();
      moveComputer();

      ball.x += ball.velocityX;
      ball.y += ball.velocityY;

      // Top and bottom wall collisions.
      if (ball.y <= 0) {
        ball.y = 0;
        ball.velocityY *= -1;
      }

      if (ball.y + ball.size >= canvas.height) {
        ball.y = canvas.height - ball.size;
        ball.velocityY *= -1;
      }

      // Left paddle collision.
      if (ball.velocityX < 0 && ballHitsPaddle(player)) {
        ball.x = player.x + paddle.width;
        changeBallDirection(player);
      }

      // Right paddle collision.
      if (ball.velocityX > 0 && ballHitsPaddle(computer)) {
        ball.x = computer.x - ball.size;
        changeBallDirection(computer);
      }

      // Scoring.
      if (ball.x + ball.size < 0) {
        computer.score++;
        computerScoreElement.textContent = computer.score;
        resetBall(1);
      }

      if (ball.x > canvas.width) {
        player.score++;
        playerScoreElement.textContent = player.score;
        resetBall(-1);
      }
    }

    function changeBallDirection(paddleObject) {
      const paddleCenter = paddleObject.y + paddle.height / 2;
      const ballCenter = ball.y + ball.size / 2;
      const relativeIntersection = ballCenter - paddleCenter;
      const normalizedIntersection = relativeIntersection / (paddle.height / 2);
      const bounceAngle = normalizedIntersection * (Math.PI / 3);

      const direction = ball.velocityX > 0 ? -1 : 1;
      const currentSpeed = Math.min(
        Math.sqrt(ball.velocityX ** 2 + ball.velocityY ** 2) + 0.2,
        12
      );

      ball.velocityX = Math.cos(bounceAngle) * currentSpeed * direction;
      ball.velocityY = Math.sin(bounceAngle) * currentSpeed;
    }

    function drawRect(x, y, width, height, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, width, height);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Center line.
      ctx.setLineDash([10, 12]);
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      drawRect(player.x, player.y, paddle.width, paddle.height, "#38bdf8");
      drawRect(computer.x, computer.y, paddle.width, paddle.height, "#f87171");
      drawRect(ball.x, ball.y, ball.size, ball.size, "#ffffff");
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener("mousemove", (event) => {
      const bounds = canvas.getBoundingClientRect();
      const scaleY = canvas.height / bounds.height;
      const mouseY = (event.clientY - bounds.top) * scaleY;

      player.y = clamp(
        mouseY - paddle.height / 2,
        0,
        canvas.height - paddle.height
      );
    });

    window.addEventListener("keydown", (event) => {
      if (event.key in keys) {
        keys[event.key] = true;
        event.preventDefault();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
        event.preventDefault();
      }
    });

    resetBall(Math.random() > 0.5 ? 1 : -1);
    gameLoop();
  </script>
</body>
</html>
